# LSP Specs — Nokia Lab SFO2

## Customer LSPs

```yaml
lsps:
  lsp-customer-a:
    name: "Customer-A Primary"
    customer: "Customer A"
    sla_tier: "platinum"
    src: R1
    dst: R4
    bandwidth_gbps: 2.0
    priority: 1                     # highest — never preempted
    
    primary_path:
      explicit: ["R1","R2","R3","R4"]
      igp_metric_sum: 30
      
    protection:
      type: "facility"              # facility | path | none
      backup_path: ["R1","R4"]      # direct cross-link
      
    constraints:
      avoid_links: []               # operator-defined exclusions
      max_hops: 5
      
    orca_policy:
      autonomous_reroute: true
      notify_on_reroute: true
      approval_required: false      # ORCA can act without human approval
      preferred_reroute_paths:
        - ["R1","R6","R5","R4"]
        - ["R1","R4"]

  lsp-customer-b:
    name: "Customer-B Primary"
    customer: "Customer B"
    sla_tier: "gold"
    src: R2
    dst: R6
    bandwidth_gbps: 1.5
    priority: 2
    
    primary_path:
      explicit: ["R2","R3","R4","R5","R6"]
      igp_metric_sum: 40
      
    protection:
      type: "path"
      backup_path: ["R2","R5","R6"]
      
    constraints:
      avoid_links: []
      max_hops: 6
      
    orca_policy:
      autonomous_reroute: true
      notify_on_reroute: true
      approval_required: false
      preferred_reroute_paths:
        - ["R2","R5","R6"]
        - ["R2","R1","R6"]

  lsp-mgmt:
    name: "Management"
    customer: "Internal"
    sla_tier: "standard"
    src: R1
    dst: R6
    bandwidth_gbps: 0.5
    priority: 7                     # lowest
    
    primary_path:
      explicit: ["R1","R6"]
      igp_metric_sum: 10
      
    protection:
      type: "none"
      
    orca_policy:
      autonomous_reroute: false     # management LSP — human approval required
      notify_on_reroute: true
      approval_required: true
```
