# LSP Specs — Nokia Lab SFO2

## Customer LSPs

```yaml
lsps:
  lsp-customer-a:
    name: "Customer-A Primary"
    customer: "Customer A"
    sla_tier: "platinum"
    src: PE-01
    dst: PE-04
    bandwidth_gbps: 2.0
    priority: 1                     # highest — never preempted
    
    primary_path:
      explicit: ["PE-01","P-02","PE-03","PE-04"]
      igp_metric_sum: 30
      
    protection:
      type: "facility"              # facility | path | none
      backup_path: ["PE-01","PE-04"]      # direct cross-link
      
    constraints:
      avoid_links: []               # operator-defined exclusions
      max_hops: 5
      
    orca_policy:
      autonomous_reroute: true
      notify_on_reroute: true
      approval_required: false      # ORCA can act without human approval
      preferred_reroute_paths:
        - ["PE-01","PE-02","P-01","PE-04"]
        - ["PE-01","PE-04"]

  lsp-customer-b:
    name: "Customer-B Primary"
    customer: "Customer B"
    sla_tier: "gold"
    src: P-02
    dst: PE-02
    bandwidth_gbps: 1.5
    priority: 2
    
    primary_path:
      explicit: ["P-02","PE-03","PE-04","P-01","PE-02"]
      igp_metric_sum: 40
      
    protection:
      type: "path"
      backup_path: ["P-02","P-01","PE-02"]
      
    constraints:
      avoid_links: []
      max_hops: 6
      
    orca_policy:
      autonomous_reroute: true
      notify_on_reroute: true
      approval_required: false
      preferred_reroute_paths:
        - ["P-02","P-01","PE-02"]
        - ["P-02","PE-01","PE-02"]

  lsp-mgmt:
    name: "Management"
    customer: "Internal"
    sla_tier: "standard"
    src: PE-01
    dst: PE-02
    bandwidth_gbps: 0.5
    priority: 7                     # lowest
    
    primary_path:
      explicit: ["PE-01","PE-02"]
      igp_metric_sum: 10
      
    protection:
      type: "none"
      
    orca_policy:
      autonomous_reroute: false     # management LSP — human approval required
      notify_on_reroute: true
      approval_required: true
```
