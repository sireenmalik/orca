!
! Nokia 7750 SR Configuration
! Device: R2
! Updated: 2026-04-08 14:22 UTC
! Change: Reduce IGP metric on R2-R5 interface
!
configure
    router isis
        interface "to-R5"
            level 2
                metric 5
            exit
        exit
    exit
    
    interface "to-R5"
        port 1/1/5
        encap-type dot1q
        isis
            metric 5
        exit
    exit
exit