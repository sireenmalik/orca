# R1 Configuration - IGP Metric Updates
# Generated after R1-R4 link failure incident
# Date: 2026-04-08 11:42:44 UTC

configure router isis
    interface "system"
        ipv4-node-sid 1
    exit
    interface "to-R2"
        isis metric 15  # Increased from 10 to prefer R1-R6 path
        ipv4-node-sid 12
    exit
    interface "to-R6"  
        isis metric 10  # Remains preferred path
        ipv4-node-sid 16
    exit
exit

