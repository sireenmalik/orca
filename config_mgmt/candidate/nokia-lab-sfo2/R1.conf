# R1 Configuration - Post R1-R4 Failure Optimization
# Updated: 2026-04-08 13:49:52 UTC
# Incident: R1-R4 link failure and congestion mitigation

router isis 1
    interface system
        passive
    exit
    interface R1-R2
        isis metric 10
    exit  
    interface R1-R6
        isis metric 5  # Reduced from 10 to prefer R6 path
    exit
    interface R1-R4
        shutdown  # Link DOWN - awaiting hardware repair
    exit
exit

# MPLS LSP Configurations
router mpls
    path "lsp-customer-a-primary" 
        hop 1 R6 strict
        hop 2 R5 strict  
        hop 3 R4 strict
    exit
    lsp "lsp-customer-a"
        type p2p
        to 10.0.0.4
        primary "lsp-customer-a-primary"
        bandwidth 2000
    exit
exit