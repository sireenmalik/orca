title: UPF QER drift causing slice latency SLA risk, enforce GBR via config change
rationale: For customer cust-A, slice-A p99 latency was 13.0 ms (SLA 15 ms) with a
  rising trend projecting breach in ~10 minutes due to UPF-01 QER drift (enforced
  32 Mbps vs intent 50 Mbps GBR). Human-involved ops restored the enforced GBR to
  50 Mbps via NETCONF config change, preventing SLA breach and saving $2.4M ARR. Matching
  future incidents with similar latency rise, QER drift, and ARR risk should trigger
  the same config change action.
