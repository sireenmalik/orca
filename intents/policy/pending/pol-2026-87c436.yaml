intent_id: pol-2026-87c436
source_episode: 20260513-081422
proposed_by: orca-distiller
proposed_at: '2026-05-13T08:14:23Z'
title: UPF QER GBR drift causing slice latency SLA risk, restore GBR via config change
rationale: For customer cust-A, slice-A p99 N3 latency was 13.0 ms (SLA 15 ms) with
  a rising trend projecting breach within ~10 minutes. UPF-01 QER showed enforced
  GBR of 32 Mbps versus the committed 50 Mbps, causing the drift. Increasing the GBR
  to 50 Mbps via NETCONF config change on UPF-01 restored the SLA margin and saved
  $2.4M ARR.
match:
  slice_p99_latency_us: '>12000'
  slice_p99_rising_pct: '>2'
  upf_qer_status: ==gbr_mismatch
  affected_customer_count: '>=1'
  customer_arr_at_risk_usd: '>1000000'
action:
  type: save_via_config_change
  target: UPF-01
  parameters:
    slice: slice-A
    gbr_mbps: 50
  nokia_config_change: true
confidence: 0.7
scope:
  customer_segments:
  - enterprise
  domains_involved:
